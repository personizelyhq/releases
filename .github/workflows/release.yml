name: Release

# Run from the Actions tab ("Release" > "Run workflow") or with:
#   gh workflow run release.yml -f bump=patch
# It runs CI, bumps package.json, commits and tags the bare version (0.5.4, no "v"),
# publishes to npm and creates the GitHub release with generated notes.
# Publishing happens here because a release created with GITHUB_TOKEN does not
# trigger other workflows. If the npm publish fails, fix the cause and run this
# again with bump "none": it publishes the already tagged version.
# Prereleases (1.0.0-beta.1, set by hand in package.json, released with "none")
# go to the "next" dist-tag.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        # none: publish the current version again after a failed npm publish
        # (its commit and tag are already pushed), without bumping
        options: [patch, minor, major, none]
        default: patch
      title:
        description: Release title (defaults to the version)
        type: string
        required: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump commit and tag, create the release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing (OIDC) needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Bump the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$BUMP" = none ]; then
            VERSION=$(node -p "require('./package.json').version")
            if ! git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
              echo "::error::Tag $VERSION does not exist. Use none only to retry a release whose tag is already pushed."
              exit 1
            fi
          else
            VERSION=$(npm version "$BUMP" --no-git-tag-version)
            VERSION=${VERSION#v}
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;; *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;; esac
          echo "Releasing $VERSION"

      - name: Commit and tag
        if: inputs.bump != 'none'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $VERSION"
          git tag "$VERSION"
          git push --atomic origin HEAD:master "$VERSION"

      # Authenticates with npm trusted publishing (no token): the package's trusted
      # publisher on npmjs.com must be personizelyhq/releases with workflow release.yml.
      # prepack builds dist/; prepublishOnly runs typecheck and tests once more.
      - run: npm publish --provenance --access public --tag ${{ steps.version.outputs.dist_tag }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TITLE: ${{ inputs.title }}
          PRERELEASE: ${{ steps.version.outputs.dist_tag == 'next' && '--prerelease' || '' }}
        run: gh release create "$VERSION" --title "${TITLE:-$VERSION}" --generate-notes --verify-tag $PRERELEASE
